name: "Multi-Region Web - Application CI/CD"

# Customize: adjust paths filter to match your application source directory
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  # Customize: set your App Service names for both regions
  AZURE_WEBAPP_NAME_PRIMARY: "my-app-eastus2"
  AZURE_WEBAPP_NAME_SECONDARY: "my-app-westus2"
  AZURE_WEBAPP_PACKAGE_PATH: "."
  NODE_VERSION: "20"

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Customize: switch to .NET setup if using a .NET application
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-build
          path: .

  deploy-primary:
    name: Deploy to Primary Region
    runs-on: ubuntu-latest
    needs: build
    environment: production-primary
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-build

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Primary App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME_PRIMARY }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy-secondary:
    name: Deploy to Secondary Region
    runs-on: ubuntu-latest
    needs: build
    environment: production-secondary
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-build

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Secondary App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME_SECONDARY }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
