name: "Microservices AKS - Application CI/CD"

# Customize: adjust paths to match your microservices source directories
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  # Customize: set your ACR and AKS resource names
  ACR_NAME: "mycontainerregistry"
  AKS_CLUSTER_NAME: "my-aks-cluster"
  AKS_RESOURCE_GROUP: "my-aks-rg"
  IMAGE_NAME: "my-microservice"

jobs:
  build:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set image tag
        id: meta
        run: |
          TAG="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "tags=${TAG}" >> $GITHUB_OUTPUT

      # Customize: adjust Dockerfile path and context for each microservice
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.meta.outputs.tags }} \
            -f Dockerfile .

      - name: Push to ACR
        run: docker push ${{ steps.meta.outputs.tags }}

  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AKS_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      # Customize: update your Kubernetes manifests path and image placeholder
      - name: Update manifest image tag
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|${{ needs.build.outputs.image-tag }}|g" \
            k8s/deployment.yml

      - name: Deploy to AKS
        run: kubectl apply -f k8s/
