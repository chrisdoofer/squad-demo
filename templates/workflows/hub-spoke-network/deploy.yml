name: Deploy Hub-Spoke Network

on:
  workflow_dispatch:
    inputs:
      hubName:
        description: 'Name prefix for hub resources'
        required: true
        type: string
      location:
        description: 'Azure region'
        required: false
        type: string
        default: 'uksouth'
      spokeCount:
        description: 'Number of spoke VNets (1-10)'
        required: false
        type: number
        default: 2
      enableVpnGateway:
        description: 'Deploy VPN Gateway in the hub'
        required: false
        type: boolean
        default: false
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production
      resourceGroup:
        description: 'Azure Resource Group name'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ inputs.resourceGroup }}
          template: ./templates/bicep/hub-spoke-network/main.bicep
          parameters: >
            hubName=${{ inputs.hubName }}
            location=${{ inputs.location }}
            spokeCount=${{ inputs.spokeCount }}
            enableVpnGateway=${{ inputs.enableVpnGateway }}
          deploymentMode: Validate

      - name: What-If Preview
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ inputs.resourceGroup }}
          template: ./templates/bicep/hub-spoke-network/main.bicep
          parameters: >
            hubName=${{ inputs.hubName }}
            location=${{ inputs.location }}
            spokeCount=${{ inputs.spokeCount }}
            enableVpnGateway=${{ inputs.enableVpnGateway }}
          additionalArguments: --what-if

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure
        id: deploy
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ inputs.resourceGroup }}
          template: ./templates/bicep/hub-spoke-network/main.bicep
          parameters: >
            hubName=${{ inputs.hubName }}
            location=${{ inputs.location }}
            spokeCount=${{ inputs.spokeCount }}
            enableVpnGateway=${{ inputs.enableVpnGateway }}
          deploymentName: idp-hub-spoke-network-${{ github.run_number }}

      - name: Deployment Outputs
        run: |
          echo "## Deployment Outputs" >> $GITHUB_STEP_SUMMARY
          echo "- **Hub VNet ID:** ${{ steps.deploy.outputs.hubVnetId }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Firewall Private IP:** ${{ steps.deploy.outputs.firewallPrivateIp }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bastion ID:** ${{ steps.deploy.outputs.bastionId }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Spoke VNet IDs:** ${{ steps.deploy.outputs.spokeVnetIds }}" >> $GITHUB_STEP_SUMMARY
          echo "- **VPN Gateway ID:** ${{ steps.deploy.outputs.vpnGatewayId }}" >> $GITHUB_STEP_SUMMARY
