name: Deploy Basic Web App
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      resource-group:
        description: 'Azure Resource Group name'
        required: true
        type: string
      location:
        description: 'Azure region'
        required: false
        type: string
        default: 'uksouth'
      appName:
        description: 'Name of the web application'
        required: true
        type: string
      sqlAdminLogin:
        description: 'SQL Server administrator login name'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/reusable-bicep-validate.yml
    with:
      template-path: templates/bicep/basic-web-app/main.bicep
      resource-group: ${{ inputs.resource-group }}
    secrets: inherit

  deploy-dev:
    needs: validate
    if: inputs.environment == 'dev'
    uses: ./.github/workflows/reusable-bicep-deploy.yml
    with:
      template-path: templates/bicep/basic-web-app/main.bicep
      resource-group: ${{ inputs.resource-group }}
      location: ${{ inputs.location }}
      parameters: >-
        appName=${{ inputs.appName }}
        location=${{ inputs.location }}
        sqlAdminLogin=${{ inputs.sqlAdminLogin }}
        sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}
    secrets: inherit

  deploy-staging:
    needs: validate
    if: inputs.environment == 'staging'
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to Staging
        run: |
          az deployment group create \
            --resource-group ${{ inputs.resource-group }} \
            --template-file templates/bicep/basic-web-app/main.bicep \
            --parameters \
              appName=${{ inputs.appName }} \
              location=${{ inputs.location }} \
              sqlAdminLogin=${{ inputs.sqlAdminLogin }} \
              sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}

  deploy-prod:
    needs: validate
    if: inputs.environment == 'prod'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to Production
        run: |
          az deployment group create \
            --resource-group ${{ inputs.resource-group }} \
            --template-file templates/bicep/basic-web-app/main.bicep \
            --parameters \
              appName=${{ inputs.appName }} \
              location=${{ inputs.location }} \
              sqlAdminLogin=${{ inputs.sqlAdminLogin }} \
              sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}
