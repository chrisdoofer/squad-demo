name: Deploy Basic Web App

on:
  workflow_dispatch:
    inputs:
      appName:
        description: 'Name of the web application'
        required: true
        type: string
      location:
        description: 'Azure region'
        required: false
        type: string
        default: 'uksouth'
      sqlAdminLogin:
        description: 'SQL Server administrator login name'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production
      resourceGroup:
        description: 'Azure Resource Group name'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ inputs.resourceGroup }}
          template: ./templates/bicep/basic-web-app/main.bicep
          parameters: >
            appName=${{ inputs.appName }}
            location=${{ inputs.location }}
            sqlAdminLogin=${{ inputs.sqlAdminLogin }}
            sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}
          deploymentMode: Validate

      - name: What-If Preview
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ inputs.resourceGroup }}
          template: ./templates/bicep/basic-web-app/main.bicep
          parameters: >
            appName=${{ inputs.appName }}
            location=${{ inputs.location }}
            sqlAdminLogin=${{ inputs.sqlAdminLogin }}
            sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}
          additionalArguments: --what-if

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure
        id: deploy
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ inputs.resourceGroup }}
          template: ./templates/bicep/basic-web-app/main.bicep
          parameters: >
            appName=${{ inputs.appName }}
            location=${{ inputs.location }}
            sqlAdminLogin=${{ inputs.sqlAdminLogin }}
            sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}
          deploymentName: idp-basic-web-app-${{ github.run_number }}

      - name: Deployment Outputs
        run: |
          echo "## Deployment Outputs" >> $GITHUB_STEP_SUMMARY
          echo "- **Web App Hostname:** ${{ steps.deploy.outputs.webAppHostName }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Web App ID:** ${{ steps.deploy.outputs.webAppId }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SQL Server ID:** ${{ steps.deploy.outputs.sqlServerId }}" >> $GITHUB_STEP_SUMMARY
          echo "- **App Insights ID:** ${{ steps.deploy.outputs.appInsightsId }}" >> $GITHUB_STEP_SUMMARY
