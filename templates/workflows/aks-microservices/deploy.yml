name: Deploy Microservices on AKS

on:
  workflow_dispatch:
    inputs:
      clusterName:
        description: 'Name of the AKS cluster'
        required: true
        type: string
      location:
        description: 'Azure region'
        required: false
        type: string
        default: 'uksouth'
      nodeCount:
        description: 'Number of agent nodes'
        required: false
        type: number
        default: 3
      nodeVmSize:
        description: 'VM size for agent nodes'
        required: false
        type: string
        default: 'Standard_D4s_v3'
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production
      resourceGroup:
        description: 'Azure Resource Group name'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ inputs.resourceGroup }}
          template: ./templates/bicep/aks-microservices/main.bicep
          parameters: >
            clusterName=${{ inputs.clusterName }}
            location=${{ inputs.location }}
            nodeCount=${{ inputs.nodeCount }}
            nodeVmSize=${{ inputs.nodeVmSize }}
          deploymentMode: Validate

      - name: What-If Preview
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ inputs.resourceGroup }}
          template: ./templates/bicep/aks-microservices/main.bicep
          parameters: >
            clusterName=${{ inputs.clusterName }}
            location=${{ inputs.location }}
            nodeCount=${{ inputs.nodeCount }}
            nodeVmSize=${{ inputs.nodeVmSize }}
          additionalArguments: --what-if

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure
        id: deploy
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ inputs.resourceGroup }}
          template: ./templates/bicep/aks-microservices/main.bicep
          parameters: >
            clusterName=${{ inputs.clusterName }}
            location=${{ inputs.location }}
            nodeCount=${{ inputs.nodeCount }}
            nodeVmSize=${{ inputs.nodeVmSize }}
          deploymentName: idp-aks-microservices-${{ github.run_number }}

      - name: Deployment Outputs
        run: |
          echo "## Deployment Outputs" >> $GITHUB_STEP_SUMMARY
          echo "- **AKS Cluster FQDN:** ${{ steps.deploy.outputs.aksClusterFqdn }}" >> $GITHUB_STEP_SUMMARY
          echo "- **ACR Login Server:** ${{ steps.deploy.outputs.acrLoginServer }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Service Bus Endpoint:** ${{ steps.deploy.outputs.serviceBusEndpoint }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Cosmos DB Endpoint:** ${{ steps.deploy.outputs.cosmosDbEndpoint }}" >> $GITHUB_STEP_SUMMARY
          echo "- **App Insights Connection String:** ${{ steps.deploy.outputs.appInsightsConnectionString }}" >> $GITHUB_STEP_SUMMARY
