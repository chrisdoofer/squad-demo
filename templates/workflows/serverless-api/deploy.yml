name: Deploy Serverless API
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      resource-group:
        description: 'Azure Resource Group name'
        required: true
        type: string
      location:
        description: 'Azure region'
        required: false
        type: string
        default: 'uksouth'
      appName:
        description: 'Name prefix for all resources'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/reusable-bicep-validate.yml
    with:
      template-path: templates/bicep/serverless-api/main.bicep
      resource-group: ${{ inputs.resource-group }}
    secrets: inherit

  deploy-dev:
    needs: validate
    if: inputs.environment == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy serverless infrastructure
        run: |
          az deployment group create \
            --resource-group ${{ inputs.resource-group }} \
            --template-file templates/bicep/serverless-api/main.bicep \
            --parameters \
              appName=${{ inputs.appName }} \
              location=${{ inputs.location }}
      - name: Verify Function App health
        run: |
          FUNC_NAME="${{ inputs.appName }}-func"
          echo "Checking Function App status..."
          az functionapp show \
            --resource-group ${{ inputs.resource-group }} \
            --name "${FUNC_NAME}" \
            --query "state" \
            --output tsv

  deploy-staging:
    needs: validate
    if: inputs.environment == 'staging'
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy serverless infrastructure
        run: |
          az deployment group create \
            --resource-group ${{ inputs.resource-group }} \
            --template-file templates/bicep/serverless-api/main.bicep \
            --parameters \
              appName=${{ inputs.appName }} \
              location=${{ inputs.location }}
      - name: Verify Function App health
        run: |
          FUNC_NAME="${{ inputs.appName }}-func"
          echo "Checking Function App status..."
          az functionapp show \
            --resource-group ${{ inputs.resource-group }} \
            --name "${FUNC_NAME}" \
            --query "state" \
            --output tsv

  deploy-prod:
    needs: validate
    if: inputs.environment == 'prod'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy serverless infrastructure
        run: |
          az deployment group create \
            --resource-group ${{ inputs.resource-group }} \
            --template-file templates/bicep/serverless-api/main.bicep \
            --parameters \
              appName=${{ inputs.appName }} \
              location=${{ inputs.location }}
      - name: Verify Function App health
        run: |
          FUNC_NAME="${{ inputs.appName }}-func"
          echo "Checking Function App status..."
          az functionapp show \
            --resource-group ${{ inputs.resource-group }} \
            --name "${FUNC_NAME}" \
            --query "state" \
            --output tsv
