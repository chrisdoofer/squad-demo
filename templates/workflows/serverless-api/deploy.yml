name: Deploy Serverless API

on:
  workflow_dispatch:
    inputs:
      appName:
        description: 'Name prefix for all resources'
        required: true
        type: string
      location:
        description: 'Azure region'
        required: false
        type: string
        default: 'uksouth'
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production
      resourceGroup:
        description: 'Azure Resource Group name'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ inputs.resourceGroup }}
          template: ./templates/bicep/serverless-api/main.bicep
          parameters: >
            appName=${{ inputs.appName }}
            location=${{ inputs.location }}
            environment=${{ inputs.environment == 'production' && 'prod' || inputs.environment }}
          deploymentMode: Validate

      - name: What-If Preview
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ inputs.resourceGroup }}
          template: ./templates/bicep/serverless-api/main.bicep
          parameters: >
            appName=${{ inputs.appName }}
            location=${{ inputs.location }}
            environment=${{ inputs.environment == 'production' && 'prod' || inputs.environment }}
          additionalArguments: --what-if

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure
        id: deploy
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ inputs.resourceGroup }}
          template: ./templates/bicep/serverless-api/main.bicep
          parameters: >
            appName=${{ inputs.appName }}
            location=${{ inputs.location }}
            environment=${{ inputs.environment == 'production' && 'prod' || inputs.environment }}
          deploymentName: idp-serverless-api-${{ github.run_number }}

      - name: Deployment Outputs
        run: |
          echo "## Deployment Outputs" >> $GITHUB_STEP_SUMMARY
          echo "- **Function App URL:** ${{ steps.deploy.outputs.functionAppUrl }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APIM Gateway URL:** ${{ steps.deploy.outputs.apimGatewayUrl }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Cosmos DB Endpoint:** ${{ steps.deploy.outputs.cosmosDbEndpoint }}" >> $GITHUB_STEP_SUMMARY
