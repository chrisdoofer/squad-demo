name: Deploy Static Web App
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      resource-group:
        description: 'Azure Resource Group name'
        required: true
        type: string
      location:
        description: 'Azure region'
        required: false
        type: string
        default: 'uksouth'
      appName:
        description: 'Name of the Static Web App'
        required: true
        type: string
      repositoryUrl:
        description: 'GitHub repository URL for the Static Web App source'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/reusable-bicep-validate.yml
    with:
      template-path: templates/bicep/static-web-app/main.bicep
      resource-group: ${{ inputs.resource-group }}
    secrets: inherit

  deploy-dev:
    needs: validate
    if: inputs.environment == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Static Web App infrastructure
        run: |
          az deployment group create \
            --resource-group ${{ inputs.resource-group }} \
            --template-file templates/bicep/static-web-app/main.bicep \
            --parameters \
              appName=${{ inputs.appName }} \
              location=${{ inputs.location }} \
              repositoryUrl=${{ inputs.repositoryUrl }}
      - name: Retrieve deployment token
        id: token
        run: |
          SWA_NAME="${{ inputs.appName }}-swa"
          TOKEN=$(az staticwebapp secrets list \
            --resource-group ${{ inputs.resource-group }} \
            --name "${SWA_NAME}" \
            --query "properties.apiKey" \
            --output tsv)
          echo "::add-mask::${TOKEN}"
          echo "deployment-token=${TOKEN}" >> "$GITHUB_OUTPUT"
      - name: Show deployment info
        run: |
          SWA_NAME="${{ inputs.appName }}-swa"
          az staticwebapp show \
            --resource-group ${{ inputs.resource-group }} \
            --name "${SWA_NAME}" \
            --query "{name:name, url:defaultHostname, status:contentDistributionEndpoint}" \
            --output table

  deploy-staging:
    needs: validate
    if: inputs.environment == 'staging'
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Static Web App infrastructure
        run: |
          az deployment group create \
            --resource-group ${{ inputs.resource-group }} \
            --template-file templates/bicep/static-web-app/main.bicep \
            --parameters \
              appName=${{ inputs.appName }} \
              location=${{ inputs.location }} \
              repositoryUrl=${{ inputs.repositoryUrl }}
      - name: Retrieve deployment token
        id: token
        run: |
          SWA_NAME="${{ inputs.appName }}-swa"
          TOKEN=$(az staticwebapp secrets list \
            --resource-group ${{ inputs.resource-group }} \
            --name "${SWA_NAME}" \
            --query "properties.apiKey" \
            --output tsv)
          echo "::add-mask::${TOKEN}"
          echo "deployment-token=${TOKEN}" >> "$GITHUB_OUTPUT"
      - name: Show deployment info
        run: |
          SWA_NAME="${{ inputs.appName }}-swa"
          az staticwebapp show \
            --resource-group ${{ inputs.resource-group }} \
            --name "${SWA_NAME}" \
            --query "{name:name, url:defaultHostname, status:contentDistributionEndpoint}" \
            --output table

  deploy-prod:
    needs: validate
    if: inputs.environment == 'prod'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Static Web App infrastructure
        run: |
          az deployment group create \
            --resource-group ${{ inputs.resource-group }} \
            --template-file templates/bicep/static-web-app/main.bicep \
            --parameters \
              appName=${{ inputs.appName }} \
              location=${{ inputs.location }} \
              repositoryUrl=${{ inputs.repositoryUrl }}
      - name: Retrieve deployment token
        id: token
        run: |
          SWA_NAME="${{ inputs.appName }}-swa"
          TOKEN=$(az staticwebapp secrets list \
            --resource-group ${{ inputs.resource-group }} \
            --name "${SWA_NAME}" \
            --query "properties.apiKey" \
            --output tsv)
          echo "::add-mask::${TOKEN}"
          echo "deployment-token=${TOKEN}" >> "$GITHUB_OUTPUT"
      - name: Show deployment info
        run: |
          SWA_NAME="${{ inputs.appName }}-swa"
          az staticwebapp show \
            --resource-group ${{ inputs.resource-group }} \
            --name "${SWA_NAME}" \
            --query "{name:name, url:defaultHostname, status:contentDistributionEndpoint}" \
            --output table
