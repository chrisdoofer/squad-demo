name: Validate Bicep Template
on:
  workflow_call:
    inputs:
      template-path:
        required: true
        type: string
        description: 'Path to the main.bicep file'
      resource-group:
        required: true
        type: string
      location:
        required: false
        type: string
        default: 'uksouth'
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Bicep Lint
        run: az bicep build --file ${{ inputs.template-path }}
      - name: What-If
        run: |
          az deployment group what-if \
            --resource-group ${{ inputs.resource-group }} \
            --template-file ${{ inputs.template-path }} \
            --no-pretty-print
